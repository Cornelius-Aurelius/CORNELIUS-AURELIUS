name: Publish camera controls preview
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-camera-controls.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BUILD_ARTIFACT_URL: ${{ secrets.CAMERA_CONTROLS_ARTIFACT_URL }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify and publish APK
        run: |
          set -euo pipefail
          [[ "$BUILD_ARTIFACT_URL" == https://*.oaiusercontent.com/* ]]
          curl --fail --silent --show-error --max-time 60 --proto '=https' "$BUILD_ARTIFACT_URL" -o build.zip
          name=AURELIUS-CAM-Ultra-Controls-Preview.apk
          unzip -p build.zip C.CAM.apk > "$name"
          printf '%s  %s\n' fca063f204c2275a8e658a213af784f26b9d2870bb16bc83d5a46ca11f609a32 "$name" | sha256sum -c -
          gh release create aurelius-cam-controls-preview "$name" --target "$GITHUB_SHA" --prerelease \
            --title 'Aurelius Cam Controls Preview' \
            --notes 'Debug-signed Android preview by Cornelius Aurelius. Open Aurelius Cam Controls after installation. This preview installs alongside prior versions. Official page: https://corneliusaurelius.com/aurelius-cam/'
