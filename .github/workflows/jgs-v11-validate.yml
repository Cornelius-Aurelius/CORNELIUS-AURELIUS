name: JGS V1.1 Validate

on:
  push:
    branches: [jgs-v1-1-fixes]
  pull_request:
    paths:
      - 'just-get-skills/**'
      - '.github/workflows/jgs-v11-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check just-get-skills/app.js
          node --check just-get-skills/runtime-adapter.js
          node --check just-get-skills/runtime-binary-loader.js
      - name: Validate production runtime
        run: |
          python - <<'PY'
          import gzip, json, pathlib, subprocess, hashlib
          root = pathlib.Path('just-get-skills')
          runtime = root / 'runtime.gz'
          manifest = json.loads((root / 'runtime-manifest.json').read_text())
          if not runtime.is_file():
              raise SystemExit('Missing production runtime.gz')
          blob = subprocess.check_output(['git','hash-object',str(runtime)], text=True).strip()
          print('runtime git blob', blob, 'bytes', runtime.stat().st_size, 'sha256', hashlib.sha256(runtime.read_bytes()).hexdigest())
          assert blob == '234c2fb915cf7e2a353204e5532da7785b4c4b94', blob
          raw = gzip.decompress(runtime.read_bytes())
          data = json.loads(raw)
          skills = data.get('skills', data.get('s', []))
          conns = data.get('connections', data.get('c', []))
          expected = manifest['expected']
          print('decoded bytes', len(raw), 'skills', len(skills), 'connections', len(conns))
          assert len(skills) == expected['skills'] == 12840
          assert len(conns) == expected['explicit_connections'] == 19059
          print('RUNTIME_VALID')
          PY
      - name: Validate production references
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('just-get-skills')
          html = (root / 'index.html').read_text()
          for item in ['styles.css','runtime-adapter.js','app.js','runtime-binary-loader.js','just-get-skills-logo.png','just-get-skills-share.png']:
              assert item in html, item
          for file in ['styles.css','runtime-adapter.js','app.js','runtime-binary-loader.js','runtime.gz','runtime-manifest.json','site.webmanifest','just-get-skills-logo.png','just-get-skills-share.png']:
              assert (root / file).is_file(), file
          assert '12,840' in html
          assert 'My Evidence' not in html
          assert '#48e5ff' in (root / 'styles.css').read_text().lower()
          print('REFERENCES_VALID')
          PY
