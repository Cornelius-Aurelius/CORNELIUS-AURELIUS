name: Publish camera gallery preview
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-camera-gallery.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BUILD_ARTIFACT_URL: ${{ secrets.CAMERA_GALLERY_ARTIFACT_URL }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify and publish APK
        run: |
          set -euo pipefail
          [[ "$BUILD_ARTIFACT_URL" == https://*.oaiusercontent.com/* ]]
          curl --fail --silent --show-error --max-time 60 --proto '=https' "$BUILD_ARTIFACT_URL" -o build.zip
          name=Aurelius-Cam-Gallery-Preview.apk
          unzip -p build.zip C.CAM.apk > "$name"
          printf '%s  %s\n' db2e84fae9760aec2e5ce972df31e60bc68053affc93cbb2869ea673124b9bb5 "$name" | sha256sum -c -
          gh release create aurelius-cam-gallery-preview "$name" --target "$GITHUB_SHA" --prerelease \
            --title 'Aurelius Cam Gallery Preview' \
            --notes 'Android preview with a thumbnail gallery, filters and in-app playback. Open Aurelius Cam Gallery after installation. Official page: https://corneliusaurelius.com/aurelius-cam/'
