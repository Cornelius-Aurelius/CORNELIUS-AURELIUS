name: Publish Aurelius Cam 1.0 test build
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-camera-v1-test.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BUILD_ARTIFACT_URL: ${{ secrets.CAMERA_V1_TEST_ARTIFACT_URL }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify and publish APK
        run: |
          set -euo pipefail
          [[ "$BUILD_ARTIFACT_URL" == https://*.oaiusercontent.com/* ]]
          curl --fail --silent --show-error --max-time 60 --proto '=https' "$BUILD_ARTIFACT_URL" -o build.zip
          name=Aurelius-Cam-1.0-Test.apk
          unzip -p build.zip C.CAM.apk > "$name"
          printf '%s  %s\n' 6d44d6187320830754df9e1de24afc66b85bbf4e97367b379e8fff0a44b06a62 "$name" | sha256sum -c -
          gh release create aurelius-cam-1.0-test "$name" --target "$GITHUB_SHA" --prerelease \
            --title 'Aurelius Cam 1.0 Test' \
            --notes 'Public Android test build. Open Aurelius Cam Test after installation. Official page: https://corneliusaurelius.com/aurelius-cam/'
