}}
.progressbar{width:100%;height:5px;background:#24333e;border-radius:5px;overflow:hidden;flex-shrink:0}.progressbar span{display:block;height:100%;width:0;background:#43ff75;transition:width .12s linear}.graph.locked{border:2px solid #43ff75;box-shadow:0 0 18px #43ff7566}.status.good{background:#153925;border:1px solid #43ff75;border-radius:12px;padding:5px 12px;width:100%;font-size:clamp(22px,5.7vw,30px);letter-spacing:.02em}.peg.active.done{background:#153925;box-shadow:0 0 15px #43ff7577}.status{line-height:1.2}.scale{position:relative;display:grid;grid-template-columns:repeat(5,1fr);text-align:center;padding:0 10px}.scale span:first-child{text-align:left}.scale span:last-child{text-align:right}.graph.locked{box-shadow:0 0 22px #43ff7599;outline:1px solid #43ff75}.status{min-height:44px;display:grid;place-items:center}.status.good{padding:4px 8px;background:#123d24;color:#65ff86;font-weight:850}.progressbar span{transition:width .08s linear}.appmeta{display:flex;align-items:center;justify-content:center;gap:10px}.appmeta button{font-size:12px;padding:3px 9px;border-color:#43c9ff}.installHelp{position:fixed;z-index:5;top:12%;left:50%;transform:translateX(-50%);width:min(92%,420px);background:#101924;border:1px solid #43c9ff;border-radius:14px;padding:16px;box-shadow:0 0 0 100vmax #0009}.installHelp p{font-size:14px;line-height:1.5}.installHelp button{border-color:#43c9ff}.installHelp[hidden],#installApp[hidden]{display:none}</style></head><body><main><h1>♬ C.A. Guitar Tuner</h1><div class="appmeta"><small>Standard tuning · A440 · v4</small><button id="installApp" type="button">Install app</button></div><div class="graph"><canvas id="graph"></canvas></div><div class="progressbar" aria-hidden="true"><span id="progress"></span></div><div class="scale"><span>−50</span><span>−10</span><b>0</b><span>+10</span><span>+50</span></div><div class="status" id="status">Pluck one string</div><small id="reading">Microphone not started</small><div class="head"><div class="guitar"><img src="head.png" alt="Acoustic guitar headstock"><img class="logo" src="logo.png" alt="Original Cornelius Aurelius emblem"></div><button class="peg left" style="top:23%" data-i="2">D</button><button class="peg left" style="top:40%" data-i="1">A</button><button class="peg left" style="top:58%" data-i="0">E<small>low</small></button><button class="peg right" style="top:23%" data-i="3">G</button><button class="peg right" style="top:40%" data-i="4">B</button><button class="peg right" style="top:58%" data-i="5">E<small>high</small></button></div><div class="controls"><button id="start">Start microphone</button><button id="auto">Auto ✓</button><button id="chime">Chime ON</button></div><div id="msg" role="status">Pluck open strings individually.</div><footer>Cornelius<b>Aurelius</b>.com</footer></main><section id="installHelp" class="installHelp" hidden role="dialog" aria-label="Install Guitar Tuner"><strong>Install C.A. Guitar Tuner V4</strong><p id="installMessage"></p><button type="button" id="closeInstall">Continue</button></section><script>
(()=>{let promptEvent=null;const button=document.getElementById('installApp'),panel=document.getElementById('installHelp'),msg=document.getElementById('installMessage'),close=document.getElementById('closeInstall');const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function update(){button.hidden=standalone();if(standalone())panel.hidden=true}
function help(){panel.hidden=false;const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);msg.textContent=ios?'In Safari, tap Share, then Add to Home Screen and Add.':'In Chrome or Edge, open the browser menu and choose Install app or Add to Home screen. If the install option is not offered, you can still use the tuner in your browser.';close.focus()}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e;button.textContent='Install app';update()});
button.onclick=async()=>{if(!promptEvent){help();return}const p=promptEvent;promptEvent=null;try{await p.prompt();const result=await p.userChoice;if(result.outcome==='accepted'){panel.hidden=true;button.textContent='Install app'}else help()}catch(e){help()}};
close.onclick=()=>{panel.hidden=true;button.focus()};window.addEventListener('appinstalled',()=>{promptEvent=null;panel.hidden=true;button.hidden=true});matchMedia('(display-mode: standalone)').addEventListener?.('change',update);update();
if(new URLSearchParams(location.search).has('install')&&!standalone()){panel.hidden=false;msg.textContent='Tap Install app above when your browser offers installation, or use its menu to add the tuner to your home screen.'}
})();
</script><script src="tuner.js?v=4"></script></body></html>
